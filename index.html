<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes API client for loading, creating, and deleting notes.">
  <title>QuickNotes | API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header><h1>QuickNotes</h1><p>A simple REST API client for your notes.</p></header>
    <section aria-labelledby="create-heading" class="panel">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title <span aria-hidden="true">*</span></label>
        <input id="title-input" name="title" type="text" maxlength="100" required placeholder="Enter a title">
        <label for="body-input">Body</label>
        <textarea id="body-input" name="body" rows="5" placeholder="Write your note"></textarea>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>
    <section aria-labelledby="notes-heading" class="panel">
      <div class="section-heading"><h2 id="notes-heading">Notes</h2><button id="load-btn" type="button">Load 10 notes</button></div>
      <p id="status" role="status" aria-live="polite">Select “Load 10 notes” to get started.</p>
      <ul id="notes-list" aria-label="Notes"></ul>
    </section>
    <footer>Demo powered by JSONPlaceholder. Creates and deletes are simulated by the API.</footer>
  </main>
</body>
</html>
